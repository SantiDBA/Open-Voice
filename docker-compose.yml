name: open-voice

# Open Voice — hybrid runtime.
#
#   agent            @open-voice/agent, the composition root that replaces the
#                    upstream gateway process. Listens on 8787.
#   web              the vendored Next.js browser app on 3000.
#   speaches         faster-whisper STT + Kokoro TTS, one port for both.
#   speaches-models  one-shot pre-download of both speech models, then exits.
#
# There is no LLM service here: the LLM is the OmniRoute daemon already running
# on the host, which the agent reaches through `host.docker.internal`.

services:
  agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
    # Host networking, on purpose. Docker on this machine is rootless, so the
    # agent cannot reach a host service the normal way: `host.docker.internal`
    # refuses connections, the slirp gateway is unreachable, and routing through
    # the host's WiFi address is both slow and intermittent, measured anywhere
    # between 1.4 s and 18 s for the same request. Sharing the host namespace
    # removes the hairpin entirely: the LLM is loopback and measured at 652 ms.
    # The browser still reaches the agent on ws://localhost:8787.
    network_mode: host
    # Configuration arrives through Compose interpolation rather than
    # `env_file: .env`. Compose reads the project `.env` automatically, so the
    # documented workflow is unchanged, and an operator who cannot create that
    # file can point at the tracked template instead:
    #   docker compose --env-file env.example.template up -d
    environment:
      # No default on purpose. On rootless Docker the `host-gateway` alias
      # resolves to an address where the host's services are not reachable, so
      # the container has to name a host address that OmniRoute actually listens
      # on. Fail at parse time beats starting a healthy agent with no LLM.
      #   ${VAR:?message} makes Compose exit non-zero when the variable is unset.
      LLM_BASE_URL: "${LLM_BASE_URL:-http://127.0.0.1:20128/v1}"
      LLM_API_KEY: "${LLM_API_KEY:-}"
      LLM_MODEL: "${LLM_MODEL:-auto/chat}"
      STT_BASE_URL: "${STT_BASE_URL:-http://127.0.0.1:8000/v1}"
      STT_API_KEY: "${STT_API_KEY:-}"
      STT_MODEL: "${STT_MODEL:-Systran/faster-whisper-base}"
      STT_REALTIME_ENABLED: "${STT_REALTIME_ENABLED:-false}"
      TTS_ENABLED: "${TTS_ENABLED:-true}"
      TTS_BASE_URL: "${TTS_BASE_URL:-http://127.0.0.1:8000/v1}"
      TTS_API_KEY: "${TTS_API_KEY:-}"
      TTS_MODEL: "${TTS_MODEL:-speaches-ai/Kokoro-82M-v1.0-ONNX}"
      TTS_VOICE: "${TTS_VOICE:-ef_dora}"
      TTS_VOICE_ES: "${TTS_VOICE_ES:-ef_dora}"
      TTS_VOICE_EN: "${TTS_VOICE_EN:-af_heart}"
      TTS_FORMAT: "${TTS_FORMAT:-mp3}"
      TTS_SEGMENT_MIN_LENGTH: "${TTS_SEGMENT_MIN_LENGTH:-24}"
      TTS_SEGMENT_MAX_LENGTH: "${TTS_SEGMENT_MAX_LENGTH:-240}"
      LIVE_PARTIAL_INITIAL_INTERVAL_MS: "${LIVE_PARTIAL_INITIAL_INTERVAL_MS:-2000}"
      LIVE_PARTIAL_LONG_TURN_INTERVAL_MS: "${LIVE_PARTIAL_LONG_TURN_INTERVAL_MS:-5000}"
      LIVE_PARTIAL_LONG_TURN_AFTER_MS: "${LIVE_PARTIAL_LONG_TURN_AFTER_MS:-30000}"
      AGENT_SYSTEM_PROMPT: "${AGENT_SYSTEM_PROMPT:-}"
      AGENT_SYSTEM_PROMPT_FILE: "${AGENT_SYSTEM_PROMPT_FILE:-}"
      GATEWAY_HOST: "${GATEWAY_HOST:-0.0.0.0}"
      GATEWAY_PORT: "${GATEWAY_PORT:-8787}"
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-http://localhost:3000}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      # Agentic actions. Off by default: with TOOLS_ENABLED unset the agent only
      # speaks, exactly as it did before this feature existed. Turned on, it runs
      # tools through the sandbox below, which it reaches on the host loopback
      # through the forwarder.
      TOOLS_ENABLED: "${TOOLS_ENABLED:-false}"
      SANDBOX_BASE_URL: "${SANDBOX_BASE_URL:-http://127.0.0.1:8790}"
      SANDBOX_TOKEN: "${SANDBOX_TOKEN:-}"
      TOOLS_MAX_ITERATIONS: "${TOOLS_MAX_ITERATIONS:-12}"
      TOOLS_ACTION_TIMEOUT_MS: "${TOOLS_ACTION_TIMEOUT_MS:-120000}"
      TOOLS_MAX_OUTPUT_BYTES: "${TOOLS_MAX_OUTPUT_BYTES:-262144}"
      # Where the browser connects to watch tool activity and answer approval
      # requests. Loopback only, and reachable from the host without publishing
      # a port because the agent shares the host network namespace.
      TOOLS_HOST: "${TOOLS_HOST:-127.0.0.1}"
      TOOLS_PORT: "${TOOLS_PORT:-8788}"
      # `sandbox` runs sandbox-confined tools without asking; `all` asks before
      # every tool call.
      TOOLS_APPROVAL: "${TOOLS_APPROVAL:-sandbox}"
      # The host executor, when you have started one yourself. Both empty means
      # escalation does not exist: the model is not even told it could. In the
      # compose stack, the host-executor service listens on 127.0.0.1:8791.
      HOST_EXECUTOR_BASE_URL: "${HOST_EXECUTOR_BASE_URL:-http://127.0.0.1:8791}"
      HOST_EXECUTOR_TOKEN: "${HOST_EXECUTOR_TOKEN:-}"
      # Dry-run keeps host actions in the container until you are ready to grant
      # real SSH access. Defaults to true in the agent; set to false here only
      # when the executor is configured for SSH.
      HOST_EXECUTOR_DRY_RUN: "${HOST_EXECUTOR_DRY_RUN:-true}"
      # Commands the host executor will run. Patterns use glob matching,
      # e.g. "echo *,git status". Empty means nothing may run.
      HOST_EXECUTOR_ALLOWED_COMMANDS: "${HOST_EXECUTOR_ALLOWED_COMMANDS:-}"
      # Domains the browse tool may fetch. Empty means no browsing at all.
      HOST_EXECUTOR_EGRESS_ALLOWLIST: "${HOST_EXECUTOR_EGRESS_ALLOWLIST:-}"
    # OmniRoute listens on the host. It is reached by host address, not by the
    # `host.docker.internal` alias: under rootless Docker that alias maps to a
    # namespace where host-bound services refuse connections.
    # Do not wait for the healthcheck to run: the agent process itself is the
    # thing that has to be alive, and a dead container never reports unhealthy.
    depends_on:
      # Wait for Speaches itself: the download below talks to its HTTP API, so
      # the API has to be answering before the job runs.
      speaches:
        condition: service_healthy
      speaches-models:
        condition: service_completed_successfully
    healthcheck:
      # The agent image is bundle-only: no curl, no wget, no shell. Node is the
      # only guaranteed tool, so the probe uses the built-in fetch.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/healthz').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      # NEXT_PUBLIC_* values are inlined into the bundle at build time, not read
      # at runtime. Each arg falls back to the default declared in Dockerfile.web
      # when the variable is unset in `.env`.
      args:
        NEXT_PUBLIC_GATEWAY_WS_URL: "${NEXT_PUBLIC_GATEWAY_WS_URL:-ws://localhost:8787}"
        NEXT_PUBLIC_TOOLS_WS_URL: "${NEXT_PUBLIC_TOOLS_WS_URL:-ws://localhost:8788}"
        NEXT_PUBLIC_VAD_ADAPTIVE_ENABLED: "${NEXT_PUBLIC_VAD_ADAPTIVE_ENABLED:-true}"
        NEXT_PUBLIC_VAD_CALIBRATION_MS: "${NEXT_PUBLIC_VAD_CALIBRATION_MS:-1000}"
        NEXT_PUBLIC_VAD_NOISE_FLOOR_SMOOTHING: "${NEXT_PUBLIC_VAD_NOISE_FLOOR_SMOOTHING:-0.08}"
        NEXT_PUBLIC_VAD_SPEECH_NOISE_MULTIPLIER: "${NEXT_PUBLIC_VAD_SPEECH_NOISE_MULTIPLIER:-3}"
        NEXT_PUBLIC_VAD_SILENCE_NOISE_MULTIPLIER: "${NEXT_PUBLIC_VAD_SILENCE_NOISE_MULTIPLIER:-1.8}"
        NEXT_PUBLIC_VAD_DYNAMIC_SPEECH_MIN: "${NEXT_PUBLIC_VAD_DYNAMIC_SPEECH_MIN:-0.012}"
        NEXT_PUBLIC_VAD_DYNAMIC_SPEECH_MAX: "${NEXT_PUBLIC_VAD_DYNAMIC_SPEECH_MAX:-0.12}"
        NEXT_PUBLIC_VAD_DYNAMIC_SILENCE_MIN: "${NEXT_PUBLIC_VAD_DYNAMIC_SILENCE_MIN:-0.006}"
        NEXT_PUBLIC_VAD_DYNAMIC_SILENCE_MAX: "${NEXT_PUBLIC_VAD_DYNAMIC_SILENCE_MAX:-0.08}"
        NEXT_PUBLIC_VAD_SPEECH_THRESHOLD: "${NEXT_PUBLIC_VAD_SPEECH_THRESHOLD:-0.02}"
        NEXT_PUBLIC_VAD_SILENCE_THRESHOLD: "${NEXT_PUBLIC_VAD_SILENCE_THRESHOLD:-0.012}"
        NEXT_PUBLIC_VAD_START_DEBOUNCE_MS: "${NEXT_PUBLIC_VAD_START_DEBOUNCE_MS:-160}"
        NEXT_PUBLIC_VAD_MIN_SPEECH_MS: "${NEXT_PUBLIC_VAD_MIN_SPEECH_MS:-200}"
        NEXT_PUBLIC_VAD_HANGOVER_MS: "${NEXT_PUBLIC_VAD_HANGOVER_MS:-750}"
        NEXT_PUBLIC_VAD_MAX_TURN_MS: "${NEXT_PUBLIC_VAD_MAX_TURN_MS:-30000}"
        NEXT_PUBLIC_VAD_PRE_ROLL_MS: "${NEXT_PUBLIC_VAD_PRE_ROLL_MS:-400}"
        NEXT_PUBLIC_VAD_PLAYBACK_THRESHOLD_MULTIPLIER: "${NEXT_PUBLIC_VAD_PLAYBACK_THRESHOLD_MULTIPLIER:-2.5}"
        NEXT_PUBLIC_VAD_PLAYBACK_SUPPRESS_AFTER_END_MS: "${NEXT_PUBLIC_VAD_PLAYBACK_SUPPRESS_AFTER_END_MS:-300}"
    ports:
      - "3000:3000"
    depends_on:
      agent:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  speaches:
    image: ghcr.io/speaches-ai/speaches:0.8.3-cpu
    # Serves both /v1/audio/transcriptions (faster-whisper) and
    # /v1/audio/speech (Kokoro) on this one port. No credential is required.
    # CTranslate2 knobs. int8 and a full thread count are the CPU-correct
    # settings; on this machine they did not measurably help faster-whisper-small,
    # so treat them as free rather than as the reason STT got faster.
    environment:
      WHISPER__COMPUTE_TYPE: "${WHISPER__COMPUTE_TYPE:-int8}"
      WHISPER__CPU_THREADS: "${WHISPER__CPU_THREADS:-8}"
      LOG_LEVEL: "${SPEACHES_LOG_LEVEL:-warning}"
    # Published on loopback only: the agent shares the host network namespace and
    # reaches Speaches there. Nothing outside this machine needs it.
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # Same path upstream used for this pinned image: the container's user is
      # not root, so the Hugging Face cache lives under its own home directory.
      - speaches-cache:/home/ubuntu/.cache/huggingface/hub
    healthcheck:
      # curl ships in this pinned image; upstream's own compose profile used it.
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 30s
    restart: unless-stopped

  # One-shot: download both speech models into the shared volume, then exit 0.
  # Upstream's own local-AI profile called `uv run speaches-cli model download`,
  # but the pinned 0.8.3-cpu image ships an editable install with no console
  # entry point, so that command exits 2 with "Failed to spawn: speaches-cli".
  # Speaches exposes the same operation over HTTP, and curl is in the image.
  # Two separate requests, one per model, both must succeed.
  speaches-models:
    image: ghcr.io/speaches-ai/speaches:0.8.3-cpu
    environment:
      SPEACHES_BASE_URL: http://speaches:8000
      STT_MODEL: ${STT_MODEL:-Systran/faster-whisper-base}
      TTS_MODEL: ${TTS_MODEL:-speaches-ai/Kokoro-82M-v1.0-ONNX}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        curl --fail --silent --show-error --request POST
        "$${SPEACHES_BASE_URL}/v1/models/$${STT_MODEL}" &&
        curl --fail --silent --show-error --request POST
        "$${SPEACHES_BASE_URL}/v1/models/$${TTS_MODEL}"
    volumes:
      - speaches-cache:/home/ubuntu/.cache/huggingface/hub
    depends_on:
      speaches:
        condition: service_healthy
    restart: "no"

  # The boundary the agent's commands run inside: its own container with the
  # tools a coding turn needs, on a network with no route out.
  sandbox:
    build:
      context: .
      dockerfile: Dockerfile.sandbox
    environment:
      SANDBOX_HOST: "0.0.0.0"
      SANDBOX_PORT: "8790"
      SANDBOX_WORKSPACE: "/workspace"
      # The sandbox validates its token at startup (config.ts throws if it is
      # absent), so this does not need the ":?" form that would make compose fail
      # for every command when the variable is unset. An empty token lets the
      # sandbox service start and then refuse to serve, rather than blocking the
      # whole stack from compose operations.
      SANDBOX_TOKEN: "${SANDBOX_TOKEN:-}"
      SANDBOX_ACTION_TIMEOUT_MS: "${SANDBOX_ACTION_TIMEOUT_MS:-120000}"
      SANDBOX_MAX_OUTPUT_BYTES: "${SANDBOX_MAX_OUTPUT_BYTES:-262144}"
      # The root filesystem is read-only, so tools put their caches and temp
      # files under the tmpfs mounted at /tmp instead of $HOME.
      HOME: "/tmp"
      # The only way out. The proxy decides; the sandbox cannot go around it.
      HTTP_PROXY: "http://egress-proxy:8080"
      HTTPS_PROXY: "http://egress-proxy:8080"
      http_proxy: "http://egress-proxy:8080"
      https_proxy: "http://egress-proxy:8080"
      NO_PROXY: ""
    volumes:
      # The one directory the agent can touch. Never the repository, never home.
      #
      # Default is a named volume: Docker seeds it from the image, so it is owned
      # by the container's unprivileged user and just works — a host bind mount
      # does not, because rootless Docker maps the container's uid 1000 to a
      # subordinate host uid, not to yours. Set SANDBOX_WORKSPACE_DIR=./workspace
      # to bind a host directory you can browse, and make it writable by the
      # mapped user (see docs/architecture.md).
      - "${SANDBOX_WORKSPACE_DIR:-sandbox-workspace}:/workspace"
    # Only the internal network. No published port either: a container on an
    # internal network cannot have one, which is exactly what keeps the sandbox
    # off the host's reach — the agent talks to the forwarder below instead.
    networks:
      - sandbox-net
    # The container enforces what the action server does not police itself: no
    # capabilities, no new privileges, a read-only root, and bounded memory,
    # CPU and process count.
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: "${SANDBOX_MEMORY_LIMIT:-1g}"
    cpus: "${SANDBOX_CPUS:-2}"
    pids_limit: ${SANDBOX_PIDS_LIMIT:-256}
    restart: unless-stopped

  # The sandbox's front door. It carries one port from the published loopback
  # address to the sandbox on the internal network, and nothing else: it is not a
  # proxy and not a router, so the sandbox gains no route out through it.
  sandbox-gateway:
    build:
      context: .
      dockerfile: Dockerfile.sandbox
    command: ["node", "dist/forward.cjs"]
    environment:
      FORWARD_LISTEN_HOST: "0.0.0.0"
      FORWARD_LISTEN_PORT: "8790"
      FORWARD_TARGET_HOST: "sandbox"
      FORWARD_TARGET_PORT: "8790"
    # Published on loopback only: the agent shares the host network namespace and
    # reaches the sandbox there, exactly as it reaches Speaches.
    ports:
      - "127.0.0.1:8790:8790"
    networks:
      # Internal, to reach the sandbox by name.
      - sandbox-net
      # A normal bridge, because a container on an internal network cannot
      # publish a port at all.
      - egress-net
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: "${SANDBOX_GATEWAY_MEMORY_LIMIT:-128m}"
    cpus: "${SANDBOX_GATEWAY_CPUS:-0.25}"
    pids_limit: 128
    restart: unless-stopped

  # The sandbox's only exit. It joins the internal network the sandbox is on and
  # a normal bridge of its own, so it can reach out where the sandbox cannot.
  egress-proxy:
    build:
      context: .
      dockerfile: Dockerfile.egress-proxy
    environment:
      EGRESS_HOST: "0.0.0.0"
      EGRESS_PORT: "8080"
      # Empty means no egress at all, which is the documented default.
      EGRESS_ALLOWED_DOMAINS: "${SANDBOX_ALLOWED_DOMAINS:-}"
    networks:
      - sandbox-net
      - egress-net
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: "${EGRESS_MEMORY_LIMIT:-256m}"
    cpus: "${EGRESS_CPUS:-0.5}"
    pids_limit: 128
    restart: unless-stopped

  # The host executor: an optional process the agent reaches for actions that
  # leave the sandbox. It runs commands in its own container in dry-run mode, or
  # over SSH to the operator's machine when HOST_EXECUTOR_DRY_RUN is false and
  # HOST_EXECUTOR_HOST is set. The operator starts it and stops it; nothing in
  # this stack starts it for you.
  host-executor:
    build:
      context: .
      dockerfile: Dockerfile.host-executor
    environment:
      HOST_EXECUTOR_HOST: "0.0.0.0"
      HOST_EXECUTOR_PORT: "${HOST_EXECUTOR_PORT:-8791}"
      # The token the agent presents. Left empty here so docker-compose commands
      # work without it: the host executor's own config (config.ts) refuses to
      # start without a token, so this is validated by the process that needs it,
      # not by compose interpolation that blocks every command.
      HOST_EXECUTOR_TOKEN: "${HOST_EXECUTOR_TOKEN:-}"
      HOST_EXECUTOR_ROOT: "${HOST_EXECUTOR_ROOT:-/workspace}"
      # Dry-run keeps host actions in this container until you set this to false
      # and configure HOST_EXECUTOR_HOST for SSH.
      HOST_EXECUTOR_DRY_RUN: "${HOST_EXECUTOR_DRY_RUN:-true}"
      # Command allowlist. Patterns use glob matching. Empty means nothing runs.
      HOST_EXECUTOR_ALLOWED_COMMANDS: "${HOST_EXECUTOR_ALLOWED_COMMANDS:-}"
      # Domains the browse tool may fetch. Empty means no browsing at all.
      HOST_EXECUTOR_EGRESS_ALLOWLIST: "${HOST_EXECUTOR_EGRESS_ALLOWLIST:-}"
      HOST_EXECUTOR_TIMEOUT_MS: "${HOST_EXECUTOR_TIMEOUT_MS:-120000}"
      HOST_EXECUTOR_MAX_OUTPUT_BYTES: "${HOST_EXECUTOR_MAX_OUTPUT_BYTES:-262144}"
      # The browserbot container, for host_interact. Internal only (not published);
      # the host executor proxies /act requests to it. Leave empty to disable
      # browser automation — host_interact will be refused with an actionable error.
      BROWSERBOT_BASE_URL: "${BROWSERBOT_BASE_URL:-http://browserbot:8792}"
    ports:
      - "127.0.0.1:${HOST_EXECUTOR_PORT:-8791}:8791"
    volumes:
      - host-exec-workspace:/workspace
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: "${HOST_EXECUTOR_MEMORY_LIMIT:-512m}"
    cpus: "${HOST_EXECUTOR_CPUS:-1}"
    pids_limit: 64
    restart: unless-stopped

volumes:
  speaches-cache:
  sandbox-workspace:
  host-exec-workspace:

networks:
  # `internal: true` removes the route out: a container on this network cannot
  # reach anything beyond it. Docker enforces that, so no iptables rules and no
  # extra capabilities are involved.
  sandbox-net:
    internal: true
  # A normal bridge, for the proxy's own egress.
  egress-net:
    driver: bridge